name: 问题反馈
description: 报告可以复现的功能或界面问题。
labels: []
body:
  - type: markdown
    attributes:
      value: 请使用脱敏信息和自制示例。安全漏洞请通过仓库 Security 页私密报告。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 在应用信息中查看，同时注明开发运行或打包程序。
      placeholder: 例如 0.36.0-dev.1，打包程序
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2，x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪个页面开始、点击什么，以及是否每次都发生。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或脱敏日志（可选）
      description: 隐去用户名、完整本地路径、Cookie、Token 和私人内容；不要上传用户数据库、书籍或音频。
