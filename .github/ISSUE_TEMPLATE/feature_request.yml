name: 功能建议
description: 描述需要改善的使用流程或新功能。
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与现有问题
      description: 你在完成什么事情，在哪一步遇到了困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述操作过程和结果；界面建议可以附草图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或参考（可选）
      description: 请勿附带私人内容、凭据或未授权的书籍、音频。
