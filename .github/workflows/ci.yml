name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Use a canonical Windows temporary directory
        run: |
          @'
          import assert from 'node:assert/strict'
          import { appendFileSync, lstatSync, mkdtempSync, realpathSync, rmdirSync } from 'node:fs'
          import { realpath } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'

          // Hosted Windows TEMP may use RUNNER~1; keep strict junction guards unchanged.
          const original = tmpdir()
          const parent = await realpath(original)
          const directory = await realpath(mkdtempSync(join(parent, 'ralb-ci-')))
          async function verifyCanonicalDirectory(path) {
            assert.equal(await realpath(path), resolve(path))
            assert.equal(realpathSync.native(path), resolve(path))
            const info = lstatSync(path)
            assert.ok(info.isDirectory() && !info.isSymbolicLink())
          }
          assert.match(directory, /^C:\\/i, 'Large-file unit fixtures require temporary storage on C:')
          await verifyCanonicalDirectory(parent)
          await verifyCanonicalDirectory(directory)
          process.env.TEMP = directory
          process.env.TMP = directory
          assert.equal(resolve(tmpdir()), directory)
          const probe = mkdtempSync(join(tmpdir(), 'canonical-probe-'))
          try {
            await verifyCanonicalDirectory(probe)
          } finally {
            rmdirSync(probe)
          }
          appendFileSync(process.env.GITHUB_ENV, `TEMP=${directory}\nTMP=${directory}\n`)
          console.log(JSON.stringify({ originalTemporaryDirectory: original, canonicalTemporaryDirectory: directory }))
          '@ | node --input-type=module
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Install Electron runtime
        run: npm.cmd run runtime:install
      - name: Verify pinned Electron runtime
        run: |
          @'
          import assert from 'node:assert/strict'
          import { readFileSync, statSync } from 'node:fs'
          import { join } from 'node:path'

          const expected = JSON.parse(readFileSync('package.json', 'utf8')).devDependencies.electron
          const directory = 'node_modules/electron'
          const installed = JSON.parse(readFileSync(join(directory, 'package.json'), 'utf8')).version
          const runtime = readFileSync(join(directory, 'dist/version'), 'utf8').trim().replace(/^v/, '')
          assert.equal(installed, expected)
          assert.equal(runtime, expected)
          assert.equal(readFileSync(join(directory, 'path.txt'), 'utf8').trim(), 'electron.exe')
          assert.ok(statSync(join(directory, 'dist/electron.exe')).isFile())
          console.log(JSON.stringify({ electronPackage: installed, electronRuntime: runtime, expected }))
          '@ | node --input-type=module
      - name: Check types, lint, unit tests and formatting
        run: npm.cmd run check
      - name: Build isolated preview
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          npm.cmd run build:preview -- --version 0.36.0-dev.1
