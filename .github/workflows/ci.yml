name: Checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          architecture: x64
          package-manager-cache: false
      - name: Use a canonical Windows temporary directory
        run: node scripts/build/canonical-windows-temp.ts
      - name: Set up Python for protocol and controlled desktop fixtures
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Install Electron runtime
        run: npm.cmd run runtime:install
      - name: Verify pinned Electron runtime
        run: |
          @'
          import assert from 'node:assert/strict'
          import { readFileSync, statSync } from 'node:fs'
          import { join } from 'node:path'

          const expected = JSON.parse(readFileSync('package.json', 'utf8')).devDependencies.electron
          const directory = 'node_modules/electron'
          const installed = JSON.parse(readFileSync(join(directory, 'package.json'), 'utf8')).version
          const runtime = readFileSync(join(directory, 'dist/version'), 'utf8').trim().replace(/^v/, '')
          assert.equal(installed, expected)
          assert.equal(runtime, expected)
          assert.equal(readFileSync(join(directory, 'path.txt'), 'utf8').trim(), 'electron.exe')
          assert.ok(statSync(join(directory, 'dist/electron.exe')).isFile())
          console.log(JSON.stringify({ electronPackage: installed, electronRuntime: runtime, expected }))
          '@ | node --input-type=module
      - name: Check types, lint, unit tests and formatting
        run: npm.cmd run check
      - name: Check worker protocol and Python logic without ML dependencies
        run: npm.cmd run test:worker
      - name: Build isolated preview
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          npm.cmd run build:preview -- --version 0.41.0-dev.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifests = @(Get-ChildItem -Path 'cache/managed-generated/*/manifest.json')
          if ($manifests.Count -ne 1) { throw 'Expected one fresh frozen preview' }
          $preview = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          "RALB_APP_ROOT=$($preview.appRoot)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify critical desktop flows
        run: |
          New-Item -ItemType Directory -Force -Path cache/critical-desktop | Out-Null
          npm.cmd run test:desktop:critical -- --reporter=json --output=cache/critical-desktop/artifacts > cache/critical-desktop/playwright.log
          $testExitCode = $LASTEXITCODE
          $raw = Get-Content -LiteralPath cache/critical-desktop/playwright.log -Raw
          # npm writes its command preamble before Playwright JSON.
          $begin = $raw.IndexOf('{')
          if ($begin -lt 0) { throw 'No desktop result report' }
          $result = $raw.Substring($begin) | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath cache/critical-desktop/results.json -Encoding utf8NoBOM
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ($result.stats.expected -ne 21 -or $result.stats.unexpected -ne 0 -or $result.stats.skipped -ne 0 -or $result.stats.flaky -ne 0) { throw 'Critical flows must all pass without skipped cases or retries' }
      - name: Preserve synthetic desktop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache/critical-desktop/**/*.json
            cache/critical-desktop/**/*.log
            cache/critical-desktop/**/*.png
            cache/critical-desktop/**/*.txt
          if-no-files-found: warn
          retention-days: 14
